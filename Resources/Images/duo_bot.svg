<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Antenna Pole & Ball -->
  <!-- Shadow -->
  <line x1="24" y1="5" x2="24" y2="13" stroke="#0E88C7" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Antenna Ball Shadow & Body -->
  <circle cx="24" cy="5.5" r="4.2" fill="#C5221F"/>
  <circle cx="24" cy="4.5" r="4.2" fill="#FF4B4B"/>
  <circle cx="22.5" cy="3" r="1.3" fill="#FFFFFF"/>

  <!-- Robot Ears / Bolts (Left & Right 3D) -->
  <!-- Left Ear -->
  <rect x="3" y="21" width="5" height="10" rx="2.5" fill="#0E88C7"/>
  <rect x="3" y="20" width="5" height="10" rx="2.5" fill="#38BDF8"/>
  <rect x="5" y="22" width="2" height="6" rx="1" fill="#FFFFFF"/>

  <!-- Right Ear -->
  <rect x="40" y="21" width="5" height="10" rx="2.5" fill="#0E88C7"/>
  <rect x="40" y="20" width="5" height="10" rx="2.5" fill="#38BDF8"/>
  <rect x="41" y="22" width="2" height="6" rx="1" fill="#FFFFFF"/>

  <!-- Robot Head 3D Bottom Shade -->
  <rect x="7" y="14" width="34" height="28" rx="8" fill="#0E88C7"/>
  <!-- Robot Head Main Surface -->
  <rect x="7" y="12" width="34" height="28" rx="8" fill="#1CB0F6"/>
  <!-- Head Top Bevel Highlight -->
  <rect x="9" y="13" width="30" height="4" rx="2" fill="#70D4FF" opacity="0.6"/>

  <!-- Eye Visor Screen (Dark Face Plate) -->
  <rect x="11" y="18" width="26" height="15" rx="5" fill="#0A3F5C"/>
  <rect x="12" y="19" width="24" height="13" rx="4" fill="#0B2B3E"/>

  <!-- Glowing Expressive Eyes -->
  <!-- Left Eye -->
  <circle cx="18" cy="25" r="4" fill="#58CC02"/>
  <circle cx="18" cy="25" r="3" fill="#79E618"/>
  <circle cx="17" cy="23.8" r="1.3" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <circle cx="30" cy="25" r="4" fill="#58CC02"/>
  <circle cx="30" cy="25" r="3" fill="#79E618"/>
  <circle cx="29" cy="23.8" r="1.3" fill="#FFFFFF"/>

  <!-- Cute Cheek Blushes -->
  <circle cx="13.5" cy="33.5" r="2" fill="#FF7B7B" opacity="0.7"/>
  <circle cx="34.5" cy="33.5" r="2" fill="#FF7B7B" opacity="0.7"/>

  <!-- Friendly Smile -->
  <path d="M20.5 34.5C21.8 36.2 23.5 36.8 24 36.8C24.5 36.8 26.2 36.2 27.5 34.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
</svg>
