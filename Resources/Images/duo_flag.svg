<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Flag Badge (Estonian Blue-Black-White) -->
  <rect x="2" y="6" width="44" height="36" rx="8" fill="#4895EF" />
  <mask id="flagMask" maskUnits="userSpaceOnUse" x="2" y="6" width="44" height="36">
    <rect x="2" y="6" width="44" height="36" rx="8" fill="white" />
  </mask>
  <g mask="url(#flagMask)">
    <rect x="2" y="6" width="44" height="12" fill="#0072CE" />
    <rect x="2" y="18" width="44" height="12" fill="#1E1E24" />
    <rect x="2" y="30" width="44" height="12" fill="#FFFFFF" />
  </g>
  <rect x="2" y="6" width="44" height="36" rx="8" stroke="#E5E5E5" stroke-width="2" />
</svg>
